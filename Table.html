<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Tarot Card Table</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1c1c2b, #000);
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      color: #eee;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 32px;
    }

    .table {
      position: relative;
      width: 700px;
      height: 260px;
      margin: 0 auto;
    }

    .table.fan {
      display: block;
    }

    .card {
      position: absolute;
      width: 120px;
      height: 190px;
      perspective: 1000px;
      cursor: pointer;
      transform-origin: bottom center;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-back {
      background-image: url('Card_back.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      letter-spacing: 0.2em;
      font-size: 14px;
    }

    .card-front {
      background: #f5f5f5;
      color: #222;
      transform: rotateY(180deg);
      font-size: 14px;
      padding: 12px;
      box-sizing: border-box;
    }
  </style>
</head>


<body>
  <div class="container">
    <h1 id="title">請憑直覺選擇三張牌</h1>
    <div class="table fan" id="table"></div>
  </div>

    <script>
        const CARD_COUNT = 78;
        const table = document.getElementById('table');

        const spreadAngle = 50;          // 總扇形角度（越大越開）
        const radius = 1200;              // 扇形半徑
        const centerX = 310;             // 桌面中心
        const baseY = 1300;               // 牌底 Y 軸

        let selectedCount = 0;
            const selectedPositions = [
            { x: 0, y: -200 }, // 第 1 張
            { x: 250, y: -200 }, // 第 2 張
            { x: 500, y: -200 }  // 第 3 張
            ];
        
        const tarotImages = [   // 共 78 張
        'url1.jpg',
        'url2.jpg',
        'url3.jpg',
        ];
            

        for (let i = 0; i < CARD_COUNT; i++) {
            const card = document.createElement('div');
            card.className = 'card';

            const inner = document.createElement('div');
            inner.className = 'card-inner';

            const back = document.createElement('div');
            back.className = 'card-face card-back';

            const front = document.createElement('div');
            front.className = 'card-face card-front';
            // 【新增】設定牌正面的圖片 URL
            front.style.backgroundImage = `url('Cards/${i+1}.jpeg')`;
            front.style.backgroundSize = 'cover';
            front.style.backgroundPosition = 'center';
            front.style.backgroundRepeat = 'no-repeat';

            
            inner.appendChild(back);
            inner.appendChild(front);
            card.appendChild(inner);

            // ⭐ 扇形計算
            const angle = -spreadAngle / 2 + (spreadAngle / (CARD_COUNT - 1)) * i;
            const rad = (angle * Math.PI) / 180;
            const x = centerX + radius * Math.sin(rad);
            const y = baseY - radius * Math.cos(rad);

            card.style.left = `${x}px`;
            card.style.top = `${y}px`;
            card.style.transform = `rotate(${angle}deg)`;



            card.addEventListener('click', () => {
                if (card.classList.contains('flipped')) {
                    return;
                }
                if (selectedCount >= 3){
                    return;
                }
                card.classList.add('flipped');

                const pos = selectedPositions[selectedCount];
                card.style.left = `${pos.x}px`;
                card.style.top = `${pos.y}px`;
                card.style.transform = `rotate(${0}deg)`;

                card.style.zIndex = 200 + selectedCount;

                // ⭐ 第一次點牌時隱藏標題
                if (selectedCount === 0) {
                    title.style.transition = 'opacity 0.5s';
                    title.style.opacity = '0';
                }

                selectedCount++;
            });

            table.appendChild(card);
        }
    </script>

</body>
</html>
