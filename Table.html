<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Tarot Card Table</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1c1c2b, #000);
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      color: #eee;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 32px;
    }

    .table {
      position: relative;
      width: 700px;
      height: 260px;
      margin: 0 auto;
    }

    .table.fan {
      display: block;
    }

    .card {
      position: absolute;
      width: 120px;
      height: 190px;
      perspective: 1000px;
      cursor: pointer;
      transform-origin: bottom center;
      transform: translateY(var(--left))  rotate(var(--angle));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* 抽牌前 hover 效果 */
    .card.hoverable:hover {
      transform: translateY(-30px) rotate(var(--angle)) scale(1.04);
      z-index: 150;
      filter: brightness(1.15);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-back {
      background-image: url('Card_back.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      letter-spacing: 0.2em;
      font-size: 14px;
    }

    .card-front {
      background-color: #f5f5f5; /* 預設背景色 */
      color: #222;
      transform: rotateY(180deg);
      font-size: 14px;
      border-radius: 16px;
      box-sizing: border-box;

      /* 圖片完整顯示 */
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      /* 去掉 padding，否則圖片會被內縮 */
      padding: 0;
    }
  </style>
</head>


<body>
  <div class="container">
    <h1 id="title">請憑直覺選擇三張牌</h1>
    <div class="table fan" id="table"></div>

    <div id="chatContainer" style="display:none; position:absolute; top:50%; left:0; width:100%; height:20%; pointer-events:none; text-align:center;">
      <button id="resetBtn" style = "margin-top: 24px; padding: 10px 20px; font-size: 16px; cursor: pointer; display: none;"> 重新抽牌 </button>
    </div>
    
  </div>
  

  <script>
      const CARD_COUNT = 78;
      const table = document.getElementById('table');

      const spreadAngle = 50;          // 總扇形角度（越大越開）
      const radius = 1200;              // 扇形半徑
      const centerX = 310;             // 桌面中心
      const baseY = 1300;               // 牌底 Y 軸

      let selectedCount = 0;
      const selectedPositions = [
      { x: 0, y: -300 }, // 第 1 張
      { x: 250, y: -300 }, // 第 2 張
      { x: 500, y: -300 }  // 第 3 張
      ];

      window.selectedCards = [];   // 翻到的牌的編號
      window.selectedOrientations = [];     // 翻到的牌的正逆位 -> 1: 正 ; 0 -> 逆 
      

      for (let i = 0; i < CARD_COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'card';

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        const back = document.createElement('div');
        back.className = 'card-face card-back';

        const front = document.createElement('div');
        front.className = 'card-face card-front';
        // 【新增】設定牌正面的圖片 URL
        front.style.backgroundImage = `url('Cards/${i+1}.jpeg')`;
        front.style.backgroundSize = 'cover';
        front.style.backgroundPosition = 'center';
        front.style.backgroundRepeat = 'no-repeat';

        
        inner.appendChild(back);
        inner.appendChild(front);
        card.appendChild(inner);

        // 扇形計算
        const angle = -spreadAngle / 2 + (spreadAngle / (CARD_COUNT - 1)) * i;
        const rad = (angle * Math.PI) / 180;
        const x = centerX + radius * Math.sin(rad);
        const y = baseY - radius * Math.cos(rad);

        card.style.left = `${x}px`;
        card.style.top = `${y}px`;
        card.style.setProperty('--angle', `${angle}deg`);
        card.style.setProperty('--left', '0px');
        // card.style.transform = `rotate(${angle}deg)`;
        card.classList.add('hoverable');

        // 儲存卡牌原始位置
        card.dataset.initLeft = `${x}px`;
        card.dataset.initTop = `${y}px`;
        card.dataset.initAngle = `${angle}deg`;



        card.addEventListener('click', () => {
          if (card.classList.contains('flipped')) {
              return;
          }
          if (selectedCount >= 3){
              return;
          }
          card.classList.remove('hoverable'); // ← 關 hover
          card.classList.add('flipped');

          // 決定正逆位
          const isUpright = Math.random() < 0.5 ? 1:0;  // 1 -> 正 ; 0 -> 逆
          selectedOrientations.push(isUpright);
          if (isUpright === 0){   // 逆位旋轉 180 degree
            front.style.transform = 'rotateY(180deg) rotateZ(180deg)';
          }


          const pos = selectedPositions[selectedCount];
          card.style.left = `${pos.x}px`;
          card.style.top = `${pos.y}px`;
          card.style.transform = `rotate(${0}deg)`;

          card.style.zIndex = 200 + selectedCount;

          // 記錄牌的編號
          selectedCards.push(i);  //  id: 0 ~ 77


          // 第一次點牌時隱藏標題
          if (selectedCount === 0) {
              title.style.transition = 'opacity 0.5s';
              title.style.opacity = '0';
          }

          selectedCount++;
          
          // 選三張後
          if (selectedCount === 3) {

            // 剩下牌的隱藏
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
              if (!c.classList.contains('flipped')) {
                c.style.transition = 'opacity 0.5s';
                c.style.opacity = '0';
              }
            });

            // 顯示文字輸入框
            const chat = document.getElementById('chatContainer');
            chat.style.display = 'block';
            chat.style.opacity = '0';
            setTimeout(() => chat.style.transition = 'opacity 0.5s', 50);
            setTimeout(() => chat.style.opacity = '1', 100);

            // 顯示再抽牌按鈕
            document.getElementById('resetBtn').style.display = 'inline-block';
            chat.style.display = 'block';
            chat.style.pointerEvents = 'auto';
          }

        });

        table.appendChild(card);
      }

      // 重置抽牌畫面
      const resetBtn = document.getElementById('resetBtn');
      resetBtn.addEventListener('click', () => {
        // 重置狀態
        selectedCount = 0;
        selectedCards = [];
        selectedOrientations = [];

        // 回覆標題
        title.style.opacity = '1';

        // 隱藏對話框
        const chat = document.getElementById('chatContainer');
        chat.style.display = 'none';

        // 隱藏重新抽牌按鈕
        resetBtn.style.display = 'none';

        // 重置卡牌
        const cards = document.querySelectorAll('.card');
        cards.forEach (card => {
          card.style.opacity = '1';
          card.classList.add('hoverable');
          card.classList.remove('flipped');
          card.style.left = card.dataset.initLeft;
          card.style.top = card.dataset.initTop;
          card.style.transform = `rotate(${card.dataset.initAngle})`;
          card.style.zIndex = '';
          const front = card.querySelector('.card-front');
          front.style.transform = 'rotateY(180deg)';
        });
      }); 
  </script>

</body>
</html>
